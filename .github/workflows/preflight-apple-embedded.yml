name: Preflight Apple embedded

# Not for upstream, and not a build anyone should download yet: the core
# for iOS and tvOS, built to find out what stops it.
#
# Vulkan is off - MoltenVK ships as a dylib and a loose dylib beside a core is
# not something these systems load - so the GPU is Metal here, with the software
# readback present path the core already has for frontends that hand out no
# hardware context.

on:
  push:
    branches:
      - libretro-apple-embedded
  workflow_dispatch:

jobs:
  preflight:
    name: ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            target: ios-arm64
            core: parallel_gx2_libretro_ios.dylib
          - platform: tvos
            target: tvos-arm64
            core: parallel_gx2_libretro_tvos.dylib

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Which SDKs this runner has
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build the core
        run: make -j $(sysctl -n hw.ncpu) platform=${{ matrix.target }} IOS_MINVER=13.4 MINVER=13.4

      - name: What came out
        run: |
          ls -l ${{ matrix.core }}
          vtool -show ${{ matrix.core }} || true
          otool -L ${{ matrix.core }} || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: parallel_gx2_libretro_${{ matrix.platform }}
          path: ${{ matrix.core }}
